version = 1

# Files that cannot carry an inline SPDX header: the license text and a binary
# asset. Every other file declares its license in its own header.

[[annotations]]
path = "LICENSE"
SPDX-FileCopyrightText = "2026 [ernolf] Raphael Gradenwitz <raphael.gradenwitz@googlemail.com>"
SPDX-License-Identifier = "MIT"

# JSON has no comment syntax, so the sidecar of each own workflow and the rule
# file of l10n-lint are covered here.
[[annotations]]
path = [".ncmake/workflows/*.properties.json", "lib/l10n-rules.json"]
SPDX-FileCopyrightText = "2026 [ernolf] Raphael Gradenwitz <raphael.gradenwitz@googlemail.com>"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "img/ncmake-avatar.png"
SPDX-FileCopyrightText = "2026 [ernolf] Raphael Gradenwitz <raphael.gradenwitz@googlemail.com>"
SPDX-License-Identifier = "MIT"
