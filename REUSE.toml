version = 1

# Files that cannot carry an inline SPDX header: the license text and a binary
# asset. Every other file declares its license in its own header.

[[annotations]]
path = "LICENSE"
SPDX-FileCopyrightText = "2026 [ernolf] Raphael Gradenwitz <raphael.gradenwitz@googlemail.com>"
SPDX-License-Identifier = "MIT"

# JSON has no comment syntax, so the sidecar of each own workflow, the known
# defects of build-audit, the rule file of l10n-lint, the licence table of
# deps-audit, the placeholders of secrets-audit and the generated data are covered
# here.
[[annotations]]
path = [".ncmake/workflows/*.properties.json", "data/*.json", "lib/build-defects.json", "lib/l10n-rules.json", "lib/licences.json", "lib/secrets-placeholders.json"]
SPDX-FileCopyrightText = "2026 [ernolf] Raphael Gradenwitz <raphael.gradenwitz@googlemail.com>"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "img/ncmake-avatar.png"
SPDX-FileCopyrightText = "2026 [ernolf] Raphael Gradenwitz <raphael.gradenwitz@googlemail.com>"
SPDX-License-Identifier = "MIT"
