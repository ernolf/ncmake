# SPDX-FileCopyrightText: 2026 [ernolf] Raphael Gradenwitz <raphael.gradenwitz@googlemail.com>
# SPDX-License-Identifier: MIT
#
# Publishes the PHP build image of ncmake for the PHP minors ahead of Nextcloud
# master, ghcr.io/ernolf/ncmake-php:<minor>-next, for amd64 and arm64.
# https://github.com/ernolf/ncmake
#
# php-images.yml covers the minors up to the PHP ceiling in lib/versioncheck.php of
# Nextcloud master. This one covers every minor above it that PHP has built: the
# release when there is one, otherwise the newest alpha, beta or RC, which the
# Docker Official Images keep under php:<minor>-rc. Once master allows a minor,
# php-images.yml takes it over and this workflow leaves it alone, so no minor is
# ever configured here. ncmake-php:next names the newest minor of the run, and the
# label ncmake.php the exact PHP of each image, for example 8.6.0RC3.
#
# The Containerfile and the inputs fingerprint are those of php-images.yml. When the
# build fails, the extensions of the Containerfile are installed one by one on the
# base image, and the image is built again without those that do not build on that
# PHP. It is published so that php-compat can run, with the label ncmake.missing
# naming them, and the run still fails on them.

name: PHP next images

on:
  schedule:
    - cron: '37 4 * * *'
  push:
    branches: [main]
    paths:
      - core/Makefile
      - .github/workflows/php-next-images.yml
  workflow_dispatch:
    inputs:
      rebuild:
        description: Build every minor, whether its inputs changed or not
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: php-next-images
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ernolf/ncmake-php

jobs:
  plan:
    name: Find the PHP minors ahead of Nextcloud master
    if: github.repository == 'ernolf/ncmake'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare the newest build of each minor with the published image
        id: plan
        env:
          REBUILD: ${{ inputs.rebuild || false }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ceiling=$(curl -fsSL https://raw.githubusercontent.com/nextcloud/server/master/lib/versioncheck.php | sed -n 's/.*PHP_VERSION_ID >= \([0-9]*\).*/\1/p' | head -1)
          [ -n "$ceiling" ] || { echo "::error::No PHP ceiling in lib/versioncheck.php of Nextcloud master"; exit 1; }
          # versioncheck.php refuses PHP_VERSION_ID >= ceiling, so the highest minor it allows is the one below it.
          ceiling=$(awk -v id="$ceiling" 'BEGIN { id -= 100; printf "%d.%d", id / 10000, id % 10000 / 100 }')
          echo "Nextcloud master runs up to PHP $ceiling"
          file=$(make -s -f core/Makefile php-containerfile)
          printf '%s\n' "$GH_TOKEN" | skopeo login ghcr.io -u "$GH_ACTOR" --password-stdin >/dev/null
          composer=docker.io/library/composer:2
          cdigest=$(skopeo inspect --no-tags --format '{{.Digest}}' "docker://$composer")
          matrix='[]'
          newest=
          # The next minor of the major, or the first ones of the next major.
          for major in "${ceiling%%.*}" "$((${ceiling%%.*} + 1))"; do
            for minor in $(seq 0 9); do
              m=$major.$minor
              if [ "$m" = "$ceiling" ] || [ "$(printf '%s\n' "$m" "$ceiling" | sort -V | tail -1)" != "$m" ]; then continue; fi
              base=
              for tag in "$m-cli-alpine" "$m-rc-cli-alpine"; do
                if digest=$(skopeo inspect --no-tags --format '{{.Digest}}' "docker://docker.io/library/php:$tag" 2>/dev/null); then
                  base=docker.io/library/php:$tag
                  break
                fi
              done
              [ -n "$base" ] || continue
              php=$(skopeo inspect --config "docker://docker.io/library/php@$digest" | jq -r '.config.Env[] | select(startswith("PHP_VERSION=")) | ltrimstr("PHP_VERSION=")')
              newest=$m
              sum=$(printf '%s\n' "$file" "$digest" "$cdigest" | sha256sum | cut -d ' ' -f 1)
              published=$(skopeo inspect --no-tags --format '{{index .Labels "ncmake.inputs"}}' "docker://$IMAGE:$m-next" 2>/dev/null || :)
              if [ "$REBUILD" != true ] && [ "$published" = "$sum" ]; then
                echo "PHP $m ($php from $base): unchanged"
                continue
              fi
              echo "PHP $m ($php from $base): to build"
              matrix=$(printf '%s' "$matrix" | jq -c --arg minor "$m" --arg php "$php" --arg base "$base@$digest" --arg composer "$composer@$cdigest" --arg sum "$sum" '. + [{minor: $minor, php: $php, base: $base, composer: $composer, sum: $sum}]')
            done
          done
          [ -n "$newest" ] || echo "::notice::No PHP image ahead of $ceiling exists"
          # Only the newest minor carries the next tag as well.
          matrix=$(printf '%s' "$matrix" | jq -c --arg image "$IMAGE" --arg newest "$newest" 'map(. + {tags: ("\($image):\(.minor)-next" + (if .minor == $newest then ",\($image):next" else "" end))})')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build and push PHP ${{ matrix.minor }} (${{ matrix.php }})
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Write the Containerfile
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/php-image"
          make -s -f core/Makefile php-containerfile > "$RUNNER_TEMP/php-image/Containerfile"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build with every extension
        id: full
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/php-image
          file: ${{ runner.temp }}/php-image/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ matrix.tags }}
          build-args: |
            base=${{ matrix.base }}
            composer=${{ matrix.composer }}
          labels: |
            ncmake.inputs=${{ matrix.sum }}
            ncmake.php=${{ matrix.php }}
            org.opencontainers.image.source=https://github.com/ernolf/ncmake

      # A PHP ahead of its release is mostly ahead of the PECL extensions too. Each
      # extension is installed on its own, as the Containerfile skips one the base
      # image already loads, which names the ones that do not build.
      - name: Find the extensions that do not build on PHP ${{ matrix.php }}
        id: probe
        if: steps.full.outcome == 'failure'
        env:
          BASE: ${{ matrix.base }}
          PHP: ${{ matrix.php }}
        run: |
          set -u
          # shellcheck disable=SC2016 # the single quotes keep $($*) for make
          exts=$(make -s -f core/Makefile --eval 'print-%: ; @echo $($*)' print-php_extensions)
          # shellcheck disable=SC2016 # the single quotes keep $($*) for make
          installer=$(make -s -f core/Makefile --eval 'print-%: ; @echo $($*)' print-php_ext_installer_url)
          # shellcheck disable=SC2016,SC2086 # the script runs in the container, and exts is a list
          failed=$(docker run --rm "$BASE" sh -c 'curl -fsSL -o /usr/local/bin/install-php-extensions "$1" && chmod +x /usr/local/bin/install-php-extensions || exit 1; shift; for e; do php -m | grep -qix "$e" && continue; install-php-extensions "$e" >/dev/null 2>&1 || echo "$e"; done' probe "$installer" $exts) \
            || { echo "::error::PHP $PHP: install-php-extensions could not be fetched into $BASE"; exit 1; }
          if [ -z "$failed" ]; then
            echo "::error::PHP $PHP: every extension builds on its own, so the build failed in another step; its log above names it"
            exit 1
          fi
          failed=$(printf '%s' "$failed" | tr '\n' ' ')
          keep=
          for e in $exts; do
            case " $failed " in *" $e "*) ;; *) keep="$keep $e" ;; esac
          done
          echo "missing=${failed% }" >> "$GITHUB_OUTPUT"
          echo "keep=${keep# }" >> "$GITHUB_OUTPUT"

      - name: Write the Containerfile without them
        if: steps.probe.outcome == 'success'
        env:
          KEEP: ${{ steps.probe.outputs.keep }}
        run: |
          set -eu
          make -s -f core/Makefile php-containerfile php_extensions="$KEEP" > "$RUNNER_TEMP/php-image/Containerfile"

      # The image keeps the fingerprint of the full Containerfile, so the next attempt
      # with every extension waits for a new base image, mostly the next pre-release,
      # rather than coming every day. ncmake.missing names what the image lacks.
      - name: Build without them
        if: steps.probe.outcome == 'success'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/php-image
          file: ${{ runner.temp }}/php-image/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ matrix.tags }}
          build-args: |
            base=${{ matrix.base }}
            composer=${{ matrix.composer }}
          labels: |
            ncmake.inputs=${{ matrix.sum }}
            ncmake.php=${{ matrix.php }}
            ncmake.missing=${{ steps.probe.outputs.missing }}
            org.opencontainers.image.source=https://github.com/ernolf/ncmake

      - name: Name the extensions the image lacks
        if: steps.probe.outcome == 'success'
        env:
          MISSING: ${{ steps.probe.outputs.missing }}
          PHP: ${{ matrix.php }}
        run: |
          echo "::error::PHP $PHP: these extensions do not build on it, and the image was published without them: $MISSING"
          exit 1
