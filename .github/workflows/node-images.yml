# SPDX-License-Identifier: MIT
#
# Publishes the Node image of ncmake, ghcr.io/ernolf/ncmake-node:latest, for amd64
# and arm64. https://github.com/ernolf/ncmake
#
# One image serves every Node line: Debian slim with git, the CA certificates, the
# compiler node-gyp builds a native module with and Yarn 1. It carries no Node. The
# core Makefile mounts the official build of the line from nodejs.org at /usr/local,
# so the image does not change with a Node release.
#
# The official Node images install Yarn 1 beside Node, and a build script that calls
# yarn without a yarn.lock relies on it. Its tarball is installed the way their
# Dockerfile does, verified against the signature of the Yarn release key, but
# linked into /usr/bin: /usr/local is where the Node line is mounted. An app with a
# yarn.lock gets the yarn its packageManager names through corepack, whose shim the
# core puts first on PATH.
#
# The image is built again only when its inputs change: the digest of its base image,
# the Containerfile, YARN_VERSION or YARN_KEY. Their fingerprint is the label
# ncmake.inputs of the published image, so a day without a change costs a few
# registry requests. workflow_dispatch with rebuild builds it whether they changed
# or not.

name: Node image

on:
  schedule:
    - cron: '47 4 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/node-images.yml
  workflow_dispatch:
    inputs:
      rebuild:
        description: Build the image, whether its inputs changed or not
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: node-images
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ernolf/ncmake-node:latest
  BASE: docker.io/library/debian:trixie-slim
  # The Yarn 1 release and the key that signs it, as the Dockerfiles of the official
  # Node images name them (https://github.com/nodejs/docker-node).
  YARN_VERSION: 1.22.22
  YARN_KEY: 6A010C5166006599AA17F08146C2130DFD2497F5
  # Yarn is fetched and verified in a stage of its own, so curl and gnupg stay out of
  # the image. libatomic1 is a library Node itself loads; the apt lists only serve the
  # install and go in the same layer.
  CONTAINERFILE: |
    ARG base
    FROM $base AS yarn
    ARG yarn
    ARG yarn_key
    RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates curl gnupg dirmngr \
      && export GNUPGHOME="$(mktemp -d)" \
      && { gpg --batch --keyserver hkps://keys.openpgp.org --recv-keys "$yarn_key" || gpg --batch --keyserver keyserver.ubuntu.com --recv-keys "$yarn_key"; } \
      && curl -fsSLO --compressed "https://yarnpkg.com/downloads/$yarn/yarn-v$yarn.tar.gz" \
      && curl -fsSLO --compressed "https://yarnpkg.com/downloads/$yarn/yarn-v$yarn.tar.gz.asc" \
      && gpg --batch --verify "yarn-v$yarn.tar.gz.asc" "yarn-v$yarn.tar.gz" \
      && mkdir -p /opt && tar -xzf "yarn-v$yarn.tar.gz" --no-same-owner -C /opt
    FROM $base
    ARG yarn
    COPY --from=yarn /opt/yarn-v$yarn /opt/yarn-v$yarn
    RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates git python3 make g++ libatomic1 && rm -rf /var/lib/apt/lists/* \
      && ln -s /opt/yarn-v$yarn/bin/yarn /usr/bin/yarn && ln -s /opt/yarn-v$yarn/bin/yarnpkg /usr/bin/yarnpkg

jobs:
  plan:
    name: Compare the inputs with the published image
    if: github.repository == 'ernolf/ncmake'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      base: ${{ steps.plan.outputs.base }}
      sum: ${{ steps.plan.outputs.sum }}
    steps:
      - name: Compare the inputs with the published image
        id: plan
        env:
          REBUILD: ${{ inputs.rebuild || false }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          printf '%s\n' "$GH_TOKEN" | skopeo login ghcr.io -u "$GH_ACTOR" --password-stdin >/dev/null
          digest=$(skopeo inspect --no-tags --format '{{.Digest}}' "docker://$BASE")
          sum=$(printf '%s\n' "$CONTAINERFILE" "$digest" "$YARN_VERSION" "$YARN_KEY" | sha256sum | cut -d ' ' -f 1)
          published=$(skopeo inspect --no-tags --format '{{index .Labels "ncmake.inputs"}}' "docker://$IMAGE" 2>/dev/null || :)
          if [ "$REBUILD" != true ] && [ "$published" = "$sum" ]; then
            echo "$IMAGE: unchanged"
            build=false
          else
            echo "$IMAGE: to build"
            build=true
          fi
          {
            echo "build=$build"
            echo "base=$BASE@$digest"
            echo "sum=$sum"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build and push the Node image
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Write the Containerfile
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/node-image"
          printf '%s\n' "$CONTAINERFILE" > "$RUNNER_TEMP/node-image/Containerfile"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/node-image
          file: ${{ runner.temp }}/node-image/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}
          build-args: |
            base=${{ needs.plan.outputs.base }}
            yarn=${{ env.YARN_VERSION }}
            yarn_key=${{ env.YARN_KEY }}
          labels: |
            ncmake.inputs=${{ needs.plan.outputs.sum }}
            org.opencontainers.image.source=https://github.com/ernolf/ncmake
