#
# Generic workflow linter: actionlint over every tracked GitHub Actions workflow.
# https://github.com/ernolf/ncmake
#
# A workflow is a YAML file in .github/workflows/, in the .ncmake/workflows/
# folder an app keeps its own workflows in, or next to a <name>.properties.json:
# the layout of a workflow source, such as ernolf/ncmake-workflows or
# nextcloud/.github, whose templates run in other repositories and are checked
# where they are written.
#
# The job runs make lint-actions of the ncmake lint module, the same target a
# maintainer runs locally, so both give the same result: the files it collects,
# the actionlint and shellcheck versions and the rule that fails live in that
# module only. actionlint reads .github/actionlint.yaml when the repository has
# one; without one the target declares the self-hosted runners of Nextcloud,
# ubuntu-latest and ubuntu-latest, as known runner labels, as
# data/github-runners.json of ncmake names them. The disable= and enable= of the
# repository's .shellcheckrc are handed on to the shellcheck actionlint runs over
# the run: scripts. The ncmake bootstrap is fetched into the runner's temp
# directory, so the repository needs none of its own. Only the step that fetches
# the ncmake modules sees a token.
#
# Every error of actionlint fails the job, and so does a shellcheck finding of
# severity error or warning in a run: script; one of severity info or style is
# shown and passes. A repository without workflows passes instead of failing, so
# the workflow can be installed anywhere without becoming a permanent red cross.
# The report goes to the job summary.

name: Lint actions

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-actions-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  NCMAKE_BOOTSTRAP: https://raw.githubusercontent.com/ernolf/ncmake/main/bootstrap/GNUmakefile

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch ncmake
        env:
          # make dev-init lists the ncmake modules through the GitHub API, which
          # answers an anonymous call from a shared hosted runner with 403 every
          # so often.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ncmake-bootstrap.mk" "$NCMAKE_BOOTSTRAP"
          make -f "$RUNNER_TEMP/ncmake-bootstrap.mk" --no-print-directory dev-init

      - name: Run make lint-actions
        run: |
          out="$RUNNER_TEMP/lint-actions.txt"
          rc=0
          make -f "$RUNNER_TEMP/ncmake-bootstrap.mk" --no-print-directory lint-actions > "$out" || rc=$?
          cat "$out"
          {
            echo '## lint-actions'
            echo
            echo '```text'
            cat "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if test "$rc" != 0; then
            echo "::error::make lint-actions failed: an error of actionlint or a shellcheck finding of severity error or warning, or a run that could not be carried out."
            exit 1
          fi
