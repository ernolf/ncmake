# SPDX-License-Identifier: MIT
#
# Generic web linter: ESLint, Stylelint and html-validate over the tracked
# JavaScript, CSS and HTML of a repository without a Node project.
# https://github.com/ernolf/ncmake
#
# The nextcloud/.github templates lint-eslint and lint-stylelint run `npm ci`
# and the repository's own lint script, so they need a package.json. A static
# site or a few hand-written scripts have none; this workflow brings the tools
# itself, each at the version pinned below. A repository with a package.json
# lints through its own scripts and passes here with a note, so its files and
# its build output are not linted a second time.
#
# A configuration in the repository root wins: eslint.config.*, a Stylelint
# config, .htmlvalidate.* or html-validate.config.*. Without one each tool uses
# its recommended set. The tools are installed outside the checkout and linked
# in as node_modules, so a repository configuration that imports a preset,
# such as @eslint/js, resolves it as well.
#
# A repository without files of a kind passes that job instead of failing, so
# the workflow can be installed anywhere without becoming a permanent red cross.

name: Lint web

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-web-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  ESLINT_VERSION: 10.13.0
  ESLINT_JS_VERSION: 10.0.1
  GLOBALS_VERSION: 17.13.0
  STYLELINT_VERSION: 17.16.0
  STYLELINT_CONFIG_STANDARD_VERSION: 40.0.0
  HTML_VALIDATE_VERSION: 11.17.0

jobs:
  files:
    name: Collect files
    runs-on: ubuntu-latest
    outputs:
      js: ${{ steps.collect.outputs.js }}
      css: ${{ steps.collect.outputs.css }}
      html: ${{ steps.collect.outputs.html }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect web files
        id: collect
        run: |
          if test -f package.json; then
            echo "This repository has a package.json and lints through its own scripts; nothing to check."
            for kind in js css html; do
              echo "$kind=[]" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          dir="$RUNNER_TEMP/web-files"
          mkdir -p "$dir"
          : > "$dir/js"
          : > "$dir/css"
          : > "$dir/html"
          # Tracked files only: a checkout carries nothing else worth linting,
          # and git handles names with spaces through the NUL separator.
          while IFS= read -r -d '' f; do
            test -f "$f" || continue
            # A tracked dependency tree or a minified copy of a library is not
            # this repository's source.
            case "$f" in
              node_modules/* | */node_modules/* | vendor/* | */vendor/* | *.min.js | *.min.css)
                continue
                ;;
            esac
            case "$f" in
              *.js | *.mjs | *.cjs) printf '%s\n' "$f" >> "$dir/js" ;;
              *.css) printf '%s\n' "$f" >> "$dir/css" ;;
              *.html | *.htm) printf '%s\n' "$f" >> "$dir/html" ;;
            esac
          done < <(git ls-files -z)
          for kind in js css html; do
            echo "$kind=$(jq -R -s -c 'split("\n") | map(select(length > 0))' < "$dir/$kind")" >> "$GITHUB_OUTPUT"
            echo "$kind files: $(wc -l < "$dir/$kind")"
            cat "$dir/$kind"
          done

  eslint:
    name: ESLint
    needs: files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: needs.files.outputs.js != '[]'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        if: needs.files.outputs.js != '[]'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install ESLint
        if: needs.files.outputs.js != '[]'
        run: |
          tools="$RUNNER_TEMP/lint-web"
          npm install --prefix "$tools" --no-audit --no-fund --no-package-lock \
            "eslint@$ESLINT_VERSION" "@eslint/js@$ESLINT_JS_VERSION" "globals@$GLOBALS_VERSION"
          ln -s "$tools/node_modules" node_modules
          cat > "$tools/eslint.config.mjs" <<'EOF'
          import js from '@eslint/js'
          import globals from 'globals'

          export default [
            js.configs.recommended,
            { languageOptions: { globals: { ...globals.browser } } },
          ]
          EOF

      - name: Run ESLint
        if: needs.files.outputs.js != '[]'
        env:
          FILES: ${{ needs.files.outputs.js }}
        run: |
          tools="$RUNNER_TEMP/lint-web"
          config=(--config "$tools/eslint.config.mjs")
          for f in eslint.config.js eslint.config.mjs eslint.config.cjs eslint.config.ts eslint.config.mts eslint.config.cts; do
            if test -f "$f"; then
              echo "Using the repository configuration $f"
              config=()
              break
            fi
          done
          # A file the configuration ignores is no finding, so passing it by
          # name must not warn either.
          jq -r '.[]' <<<"$FILES" | xargs -r -d '\n' "$tools/node_modules/.bin/eslint" --no-warn-ignored "${config[@]}"

      - name: Nothing to check
        if: needs.files.outputs.js == '[]'
        run: echo "No JavaScript file to lint."

  stylelint:
    name: Stylelint
    needs: files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: needs.files.outputs.css != '[]'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        if: needs.files.outputs.css != '[]'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install Stylelint
        if: needs.files.outputs.css != '[]'
        run: |
          tools="$RUNNER_TEMP/lint-web"
          npm install --prefix "$tools" --no-audit --no-fund --no-package-lock \
            "stylelint@$STYLELINT_VERSION" "stylelint-config-standard@$STYLELINT_CONFIG_STANDARD_VERSION"
          ln -s "$tools/node_modules" node_modules
          echo '{ "extends": ["stylelint-config-standard"] }' > "$tools/stylelint.config.json"

      - name: Run Stylelint
        if: needs.files.outputs.css != '[]'
        env:
          FILES: ${{ needs.files.outputs.css }}
        run: |
          tools="$RUNNER_TEMP/lint-web"
          config=(--config "$tools/stylelint.config.json")
          for f in .stylelintrc .stylelintrc.cjs .stylelintrc.mjs .stylelintrc.js .stylelintrc.ts \
                   .stylelintrc.json .stylelintrc.yaml .stylelintrc.yml \
                   stylelint.config.cjs stylelint.config.mjs stylelint.config.js stylelint.config.ts; do
            if test -f "$f"; then
              echo "Using the repository configuration $f"
              config=()
              break
            fi
          done
          jq -r '.[]' <<<"$FILES" | xargs -r -d '\n' "$tools/node_modules/.bin/stylelint" "${config[@]}"

      - name: Nothing to check
        if: needs.files.outputs.css == '[]'
        run: echo "No CSS file to lint."

  html-validate:
    name: html-validate
    needs: files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: needs.files.outputs.html != '[]'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        if: needs.files.outputs.html != '[]'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install html-validate
        if: needs.files.outputs.html != '[]'
        run: |
          tools="$RUNNER_TEMP/lint-web"
          npm install --prefix "$tools" --no-audit --no-fund --no-package-lock \
            "html-validate@$HTML_VALIDATE_VERSION"
          ln -s "$tools/node_modules" node_modules
          # root stops the search for further configuration files above a file.
          echo '{ "root": true, "extends": ["html-validate:recommended"] }' > "$tools/htmlvalidate.json"

      - name: Run html-validate
        if: needs.files.outputs.html != '[]'
        env:
          FILES: ${{ needs.files.outputs.html }}
        run: |
          tools="$RUNNER_TEMP/lint-web"
          config=(--config "$tools/htmlvalidate.json")
          for f in .htmlvalidate.json .htmlvalidate.js .htmlvalidate.mjs .htmlvalidate.cjs \
                   html-validate.config.mjs html-validate.config.cjs html-validate.config.js \
                   html-validate.config.mts html-validate.config.cts html-validate.config.ts; do
            if test -f "$f"; then
              echo "Using the repository configuration $f"
              config=()
              break
            fi
          done
          jq -r '.[]' <<<"$FILES" | xargs -r -d '\n' "$tools/node_modules/.bin/html-validate" "${config[@]}"

      - name: Nothing to check
        if: needs.files.outputs.html == '[]'
        run: echo "No HTML file to lint."
